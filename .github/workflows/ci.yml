name: CI

# Pull-request gate for the language atlas. The site ships as committed, so
# the cheapest possible failure — a missing data file, a dangling asset
# reference, a head that lost its share metadata — is worth catching here
# instead of on the live site. No build step and no install: check runs on
# Node's built-in runner only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm run check
